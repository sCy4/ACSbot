<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>簽收圖下載</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", sans-serif;
      background: #f5f5f5;
      color: #111;
      max-width: 720px;
      margin-left: auto;
      margin-right: auto;
    }
    .btn {
      width: 100%;
      padding: 16px;
      font-size: 18px;
      font-weight: 600;
      background: #06c755;
      color: white;
      border: none;
      border-radius: 8px;
      margin-bottom: 20px;
      cursor: pointer;
    }
    .btn:disabled { background: #aaa; cursor: not-allowed; }
    .btn:active:not(:disabled) { background: #05a548; }
    .notfound {
      font-size: 14px;
      color: #b00020;
      background: #fdecea;
      padding: 12px 14px;
      border-radius: 8px;
      margin-bottom: 16px;
    }
    .notfound .title { font-weight: 600; margin-bottom: 6px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 14px;
    }
    .thumb {
      background: #fff;
      border: 1px solid #e0e0e0;
      border-radius: 8px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .thumb img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
    }
    .thumb .caption {
      font-size: 12px;
      color: #555;
      text-align: center;
      padding: 8px 6px;
      word-break: break-all;
    }
    .status {
      text-align: center;
      padding: 32px;
      color: #666;
      font-size: 14px;
    }
    .status.error { color: #b00020; }
  </style>
</head>
<body>
  <button class="btn" id="downloadBtn" disabled>載入中…</button>
  <div id="notfound"></div>
  <div id="status" class="status">準備中…</div>
  <div class="grid" id="grid"></div>

  <script>
    // ============================================================
    // ⚠️ 修改下方這 1 行,改成你的 GAS Web App URL ⚠️
    // ============================================================
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbztxBVKzhh4p-e3TV8xo5LiDt51YMQ9x-JLL69I2r42Y6q8fbSEEDFoE3_cWw1OtA1m/exec';
    // ============================================================

    const params = new URLSearchParams(window.location.search);
    const USER_ID = params.get('user') || '';
    const NUMS = params.get('nums') || '';

    let imagesData = [];

    function setStatus(text, isError) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = isError ? 'status error' : 'status';
    }

    function loadImages() {
      if (!USER_ID || !NUMS) {
        setStatus('連結缺少必要參數', true);
        return;
      }

      setStatus('讀取圖片中…');

      // JSONP 載入,繞過 CORS
      const callbackName = 'jsonpCallback_' + Date.now();
      window[callbackName] = function(data) {
        delete window[callbackName];
        document.head.removeChild(scriptTag);
        handleData(data);
      };

      const scriptTag = document.createElement('script');
      scriptTag.src = GAS_URL +
        '?callback=' + callbackName +
        '&user=' + encodeURIComponent(USER_ID) +
        '&nums=' + encodeURIComponent(NUMS);
      scriptTag.onerror = function() {
        delete window[callbackName];
        setStatus('連線失敗,請檢查 GAS_URL 是否正確', true);
      };
      document.head.appendChild(scriptTag);
    }

    function handleData(data) {
      if (data.error) {
        setStatus('錯誤:' + data.error, true);
        return;
      }
      imagesData = data.images || [];
      renderNotFound(data.notFound || []);
      renderGrid(imagesData);
      updateButton();
    }

    function renderNotFound(list) {
      const el = document.getElementById('notfound');
      if (!list.length) { el.innerHTML = ''; return; }
      el.className = 'notfound';
      el.innerHTML = '<div class="title">找不到圖片的單號:</div>' +
        list.map(n => '<div>' + escapeHtml(n) + '</div>').join('');
    }

    function renderGrid(images) {
      const grid = document.getElementById('grid');
      if (!images.length) {
        setStatus('沒有可下載的圖片', true);
        return;
      }
      setStatus('');
      grid.innerHTML = images.map(img =>
        '<div class="thumb">' +
          '<img src="data:' + img.mimeType + ';base64,' + img.base64 + '">' +
          '<div class="caption">' + escapeHtml(img.trackingNumber) + '</div>' +
        '</div>'
      ).join('');
    }

    function updateButton() {
      const btn = document.getElementById('downloadBtn');
      if (imagesData.length === 0) {
        btn.disabled = true;
        btn.textContent = '無圖片可下載';
      } else {
        btn.disabled = false;
        btn.textContent = '下載全部(' + imagesData.length + ')';
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

    function downloadOne(img) {
      return new Promise(resolve => {
        const a = document.createElement('a');
        a.href = 'data:' + img.mimeType + ';base64,' + img.base64;
        a.download = img.trackingNumber + '.jpg';
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        resolve();
      });
    }

    document.getElementById('downloadBtn').addEventListener('click', async () => {
      const btn = document.getElementById('downloadBtn');
      btn.disabled = true;
      const total = imagesData.length;
      for (let i = 0; i < total; i++) {
        btn.textContent = '下載中… ' + (i + 1) + ' / ' + total;
        await downloadOne(imagesData[i]);
        await new Promise(r => setTimeout(r, 250));
      }
      btn.textContent = '下載完成';
      setTimeout(() => updateButton(), 1500);
    });

    loadImages();
  </script>
</body>
</html>
