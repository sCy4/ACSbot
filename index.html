<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>簽收圖下載</title>
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      background: #ffffff;
      color: #1f2328;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "Helvetica Neue", Arial, sans-serif;
      font-size: 14px;
      line-height: 1.5;
    }
    .container {
      max-width: 1012px;
      margin: 0 auto;
      padding: 32px 24px;
    }
    h1 {
      font-size: 20px;
      font-weight: 600;
      margin: 0 0 20px;
      color: #1f2328;
    }
    .btn {
      width: 100%;
      padding: 12px 16px;
      font-size: 14px;
      font-weight: 500;
      background: #1f883d;
      color: #ffffff;
      border: 1px solid rgba(31, 35, 40, 0.15);
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 20px;
      transition: background-color 0.15s;
    }
    .btn:hover:not(:disabled) { background: #1a7f37; }
    .btn:disabled {
      background: #94d3a2;
      color: #ffffff;
      cursor: not-allowed;
    }
    .notfound {
      font-size: 13px;
      color: #82071e;
      background: #ffebe9;
      border: 1px solid rgba(255, 129, 130, 0.4);
      padding: 12px 14px;
      border-radius: 6px;
      margin-bottom: 16px;
    }
    .notfound .title { font-weight: 600; margin-bottom: 4px; }
    .grid {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 12px;
    }
    .thumb {
      background: #ffffff;
      border: 1px solid #d1d9e0;
      border-radius: 6px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      transition: border-color 0.15s;
    }
    .thumb:hover { border-color: #1f883d; }
    .thumb img {
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      display: block;
      background: #f6f8fa;
    }
    .thumb .caption {
      font-size: 12px;
      color: #59636e;
      text-align: center;
      padding: 8px 6px;
      word-break: break-all;
      border-top: 1px solid #d1d9e0;
      background: #f6f8fa;
    }
    .status {
      text-align: center;
      padding: 32px 16px;
      color: #59636e;
      font-size: 14px;
    }
    .status.error { color: #82071e; }
    @media (max-width: 640px) {
      .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .container { padding: 20px 16px; }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>簽收圖下載</h1>
    <button class="btn" id="downloadBtn" disabled>載入中…</button>
    <div id="notfound"></div>
    <div id="status" class="status">準備中…</div>
    <div class="grid" id="grid"></div>
  </div>

  <script>
    // ============================================================
    // ⚠️ 修改下方這 1 行,改成你的 GAS Web App URL ⚠️
    // ============================================================
    const GAS_URL = 'https://script.google.com/macros/s/AKfycbztxBVKzhh4p-e3TV8xo5LiDt51YMQ9x-JLL69I2r42Y6q8fbSEEDFoE3_cWw1OtA1m/exec';
    // ============================================================

    const params = new URLSearchParams(window.location.search);
    const USER_ID = params.get('user') || '';
    const NUMS = params.get('nums') || '';

    let imagesData = [];

    function setStatus(text, isError) {
      const el = document.getElementById('status');
      el.textContent = text;
      el.className = isError ? 'status error' : 'status';
    }

    function loadImages() {
      if (!USER_ID || !NUMS) {
        setStatus('連結缺少必要參數', true);
        return;
      }
      setStatus('讀取圖片中…');

      const callbackName = 'jsonpCallback_' + Date.now();
      window[callbackName] = function(data) {
        delete window[callbackName];
        document.head.removeChild(scriptTag);
        handleData(data);
      };

      const scriptTag = document.createElement('script');
      scriptTag.src = GAS_URL +
        '?callback=' + callbackName +
        '&user=' + encodeURIComponent(USER_ID) +
        '&nums=' + encodeURIComponent(NUMS);
      scriptTag.onerror = function() {
        delete window[callbackName];
        setStatus('連線失敗,請檢查 GAS_URL 是否正確', true);
      };
      document.head.appendChild(scriptTag);
    }

    function handleData(data) {
      if (data.error) {
        setStatus('錯誤:' + data.error, true);
        return;
      }
      imagesData = data.images || [];
      renderNotFound(data.notFound || []);
      renderGrid(imagesData);
      updateButton();
    }

    function renderNotFound(list) {
      const el = document.getElementById('notfound');
      if (!list.length) { el.innerHTML = ''; return; }
      el.className = 'notfound';
      el.innerHTML = '<div class="title">找不到圖片的單號:</div>' +
        list.map(n => '<div>' + escapeHtml(n) + '</div>').join('');
    }

    function renderGrid(images) {
      const grid = document.getElementById('grid');
      if (!images.length) {
        setStatus('沒有可下載的圖片', true);
        return;
      }
      setStatus('');
      grid.innerHTML = images.map(img =>
        '<div class="thumb">' +
          '<img loading="lazy" src="' + img.thumbnailUrl + '" alt="' + escapeHtml(img.trackingNumber) + '">' +
          '<div class="caption">' + escapeHtml(img.trackingNumber) + '</div>' +
        '</div>'
      ).join('');
    }

    function updateButton() {
      const btn = document.getElementById('downloadBtn');
      if (imagesData.length === 0) {
        btn.disabled = true;
        btn.textContent = '無圖片可下載';
      } else {
        btn.disabled = false;
        btn.textContent = '下載全部 (' + imagesData.length + ')';
      }
    }

    function escapeHtml(s) {
      return String(s).replace(/[&<>"']/g, c => ({
        '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
      }[c]));
    }

   // 透過 GAS 代理拿圖片(避免 CORS,並確保檔名生效)
    function downloadOne(img) {
      return new Promise(resolve => {
        const callbackName = 'jsonpImg_' + Date.now() + '_' + Math.random().toString(36).slice(2, 7);

        const cleanup = () => {
          delete window[callbackName];
          if (scriptTag.parentNode) scriptTag.parentNode.removeChild(scriptTag);
        };

        window[callbackName] = function(data) {
          cleanup();
          if (data.error || !data.base64) {
            console.error('取得圖片失敗:', img.trackingNumber, data.error);
            resolve();
            return;
          }
          const a = document.createElement('a');
          a.href = 'data:' + data.mimeType + ';base64,' + data.base64;
          a.download = img.trackingNumber + '.jpg';
          document.body.appendChild(a);
          a.click();
          document.body.removeChild(a);
          resolve();
        };

        const scriptTag = document.createElement('script');
        scriptTag.src = GAS_URL +
          '?action=image' +
          '&callback=' + callbackName +
          '&user=' + encodeURIComponent(USER_ID) +
          '&num=' + encodeURIComponent(img.trackingNumber);
        scriptTag.onerror = function() {
          cleanup();
          console.error('連線失敗:', img.trackingNumber);
          resolve();
        };
        document.head.appendChild(scriptTag);
      });
    }

    document.getElementById('downloadBtn').addEventListener('click', async () => {
      const btn = document.getElementById('downloadBtn');
      btn.disabled = true;
      const total = imagesData.length;
      for (let i = 0; i < total; i++) {
        btn.textContent = '下載中… ' + (i + 1) + ' / ' + total;
        await downloadOne(imagesData[i]);
        await new Promise(r => setTimeout(r, 250));
      }
      btn.textContent = '下載完成';
      setTimeout(() => updateButton(), 1500);
    });

    loadImages();
  </script>
</body>
</html>
